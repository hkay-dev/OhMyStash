name: Storage checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bun run check
      - run: bun run test
